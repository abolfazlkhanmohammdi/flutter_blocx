name: Publish to pub.dev

# The ONLY workflow that publishes. pub.dev automated publishing accepts tag pushes only.
# pub.dev tag pattern: v{{version}}
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pubspec version
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          [ "refs/tags/v$V" = "$GITHUB_REF" ] || { echo "Tag $GITHUB_REF does not match pubspec version $V"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev # must match the environment configured on pub.dev
    permissions:
      id-token: write # OIDC token for pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1 # provisions the pub.dev OIDC credential
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies (from pub.dev, no overrides)
        run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter pub publish --dry-run
      - name: Publish
        run: flutter pub publish --force
