name: CI

# CI validates only. It never uploads anything to pub.dev.
# Publishing lives in release.yml (tag on merge to main) and publish.yml (tag push).
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call: # lets release.yml re-run the full gate on main before tagging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    steps:
      - uses: actions/checkout@v4

      # TODO(release): delete these two steps once blocx_core 1.1.0 is on pub.dev.
      - name: Checkout blocx_core for local resolution
        uses: actions/checkout@v4
        with:
          repository: abolfazlkhanmohammdi/blocx_core
          ref: develop
          path: _blocx_core

      - name: Setup local pubspec overrides for CI
        run: |
          printf 'dependency_overrides:\n  blocx_core:\n    path: ./_blocx_core\n' > pubspec_overrides.yaml
          printf 'dependency_overrides:\n  blocx_core:\n    path: ../_blocx_core\n' > example/pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=show --set-exit-if-changed lib test example/lib

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Validate package (dry run, uploads nothing)
        # TODO(release): remove continue-on-error after blocx_core 1.1.0 is published
        continue-on-error: true
        run: flutter pub publish --dry-run

      - name: Build example for web
        run: |
          cd example
          flutter pub get
          flutter build web
