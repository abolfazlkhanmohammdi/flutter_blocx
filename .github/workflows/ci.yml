name: CI

# CI validates only. It never uploads anything to pub.dev.
# Publishing lives in release.yml (tag on merge to main) and publish.yml (tag push).
# blocx_core is resolved from pub.dev (>= 1.1.0 is published). If a UI change ever needs
# UNRELEASED core code, temporarily add a checkout of blocx_core + pubspec_overrides.yaml
# (path override) and remove it again before the release.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call: # lets release.yml re-run the full gate on main before tagging

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=show --set-exit-if-changed lib test example/lib

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Validate package (dry run, uploads nothing)
        run: flutter pub publish --dry-run

      - name: Build example for web
        run: |
          cd example
          flutter pub get
          flutter build web
